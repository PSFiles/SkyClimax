[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skyclimax"
version = "0.1.0"
description = "Read-only analysis tools for the After Burner Climax static recompilation project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SkyClimax contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
decrypt = ["pycryptodome>=3.19"]

[project.scripts]
skyclimax = "skyclimax.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
